setup:
  usage:
    main: "&eКоманды настройки:"
    cmd-select: "&7 - &f/{label} setup select <трасса> &7(Выбрать активную трассу для настройки)"
    cmd-addstart: "&7 - &f/{label} setup addstart &7(Добавить текущую позицию как стартовое место)"
    cmd-clearstarts: "&7 - &f/{label} setup clearstarts &7(Удалить все стартовые места)"
    cmd-removestart: "&7 - &f/{label} setup removestart <slot> &7(Удалить одно стартовое место по номеру, начиная с 1)"
    cmd-setfinish: "&7 - &f/{label} setup setfinish &7(Установить финишную зону)"
    cmd-clearfinish: "&7 - &f/{label} setup clearfinish &7(Удалить финишную зону)"
    cmd-setpit: "&7 - &f/{label} setup setpit [команда] &7(Установить пит-зону)"
    cmd-clearpit: "&7 - &f/{label} setup clearpit &7(Удалить стандартную пит-зону)"
    cmd-addcheckpoint: "&7 - &f/{label} setup addcheckpoint &7(Добавить контрольную точку)"
    cmd-addalt: "&7 - &f/{label} setup addalt <#> &7(Добавить альтернативные ворота к контрольной точке из вашего выделения)"
    cmd-clearalt: "&7 - &f/{label} setup clearalt <#> &7(Удалить альтернативные ворота контрольной точки)"
    cmd-addlight: "&7 - &f/{label} setup addlight &7(Добавить стартовый огонь)"
    cmd-removelight: "&7 - &f/{label} setup removelight <index> &7(Удалить один стартовый огонь по номеру, начиная с 1)"
    cmd-clearlights: "&7 - &f/{label} setup clearlights &7(Удалить все стартовые огни)"
