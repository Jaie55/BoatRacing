setup:
  usage:
    main: "&eКоманди налаштування:"
    cmd-addstart: "&7 - &f/{label} setup addstart &7(Додати поточну позицію як стартовий слот; повторіть, щоб додати кілька)"
    cmd-clearstarts: "&7 - &f/{label} setup clearstarts &7(Видалити всі стартові слоти)"
    cmd-removestart: "&7 - &f/{label} setup removestart <slot> &7(Видалити стартовий слот за номером, нумерація з 1)"
    cmd-setfinish: "&7 - &f/{label} setup setfinish &7(Використати ваше виділення BoatRacing для зони фінішу)"
    cmd-clearfinish: "&7 - &f/{label} setup clearfinish &7(Видалити зону фінішу)"
    cmd-setpit: "&7 - &f/{label} setup setpit [team] &7(Встановити стандартну піт-зону з виділення або піт-зону команди, якщо вказано команду)"
    cmd-clearpit: "&7 - &f/{label} setup clearpit &7(Видалити стандартну піт-зону)"
    cmd-addcheckpoint: "&7 - &f/{label} setup addcheckpoint &7(Додати контрольну точку з виділення; можна додати кілька. Порядок важливий)"
    cmd-addalt: "&7 - &f/{label} setup addalt <#> &7(Додати альтернативні ворота до контрольної точки з вашого виділення)"
    cmd-clearalt: "&7 - &f/{label} setup clearalt <#> &7(Видалити альтернативні ворота контрольної точки)"
    cmd-addlight: "&7 - &f/{label} setup addlight &7(Додати редстоун-лампу, на яку ви дивитеся, як стартовий вогонь; максимум 5, порядок зліва направо)"
    cmd-removelight: "&7 - &f/{label} setup removelight <index> &7(Видалити стартовий вогонь за номером, нумерація з 1)"
    cmd-clearlights: "&7 - &f/{label} setup clearlights &7(Видалити всі налаштовані стартові вогні)"
    cmd-setlaps: "&7 - &f/{label} setup setlaps <n> &7(Встановити кількість кіл для гонки)"
    cmd-setpitstops: "&7 - &f/{label} setup setpitstops <n> &7(Встановити обов'язкові піт-стопи, потрібні для фінішу; 0 — вимкнути)"
    cmd-setregtime: "&7 - &f/{label} setup setregtime <seconds> &7(Встановити час очікування реєстрації в секундах)"
    cmd-setcosmetics: "&7 - &f/{label} setup setcosmetics <true|false> &7(Увімкнути або вимкнути косметику для активної траси)"
    cmd-setlobby: "&7 - &f/{label} setup setlobby &7(Встановити лобі реєстрації на поточну позицію та увімкнути його)"
    cmd-clearlobby: "&7 - &f/{label} setup clearlobby &7(Вимкнути лобі реєстрації для цієї траси)"
    cmd-setpos: "&7 - &f/{label} setup setpos <player> <slot|auto> &7(Прив'язати гравця до певного стартового слота, нумерація з 1; auto знімає прив'язку)"
    cmd-clearpos: "&7 - &f/{label} setup clearpos <player> &7(Видалити власний стартовий слот гравця)"
    cmd-clearcheckpoints: "&7 - &f/{label} setup clearcheckpoints &7(Видалити всі контрольні точки)"
    cmd-show: "&7 - &f/{label} setup show &7(Підсумок поточної конфігурації траси)"
    cmd-selinfo: "&7 - &f/{label} setup selinfo &7(Налагодження виділення: поточне виділення BoatRacing)"
